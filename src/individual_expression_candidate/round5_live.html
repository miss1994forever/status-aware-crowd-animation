<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>身体表达 · 实时预览</title>
<style>body{max-width:1180px;margin:28px auto;padding:0 20px;background:#f5f5f1;color:#253237;font:16px/1.6 system-ui}h1{font-size:26px;margin-bottom:6px}p{margin:7px 0}.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:18px 0}label{display:flex;gap:8px;align-items:center}button,select{font:inherit;padding:5px 9px;background:white;border:1px solid #bfcac3;border-radius:5px}input{accent-color:#33758c}canvas{width:100%;background:#fff;border:1px solid #d4dcd5;border-radius:6px}.small{font-size:13px;color:#62716a}output{min-width:35px;font-variant-numeric:tabular-nums}#state{font-variant-numeric:tabular-nums}</style>
<h1>身体表达 · 实时预览</h1><p>调节参数后，双方读取上一轮可见骨点，现场计算下一轮身体回应。</p>
<div class="controls"><label>身体通道<select id="mode"><option value="0">原动作</option><option value="1">当前组合</option><option value="2">加强手臂／高度</option><option value="3">加强＋躯干</option><option value="4" selected>加强＋躯干＋头颈</option></select></label><label>原片<select id="clip"><option>M01</option><option>M07</option></select></label><label>视角<select id="view"><option value="1.5707963267948966">侧面</option><option value="0.65">斜面</option><option value="0">正面</option></select></label><label><input id="interaction" type="checkbox" checked>互动回应</label><button id="pause">暂停</button><button id="reset">从头运行</button></div>
<div class="controls"><label>A status<input id="a" type="range" min="0" max="1" step=".01" value=".2"><output id="av">0.20</output></label><label>B status<input id="b" type="range" min="0" max="1" step=".01" value=".8"><output id="bv">0.80</output></label><label>相遇距离<input id="distance" type="range" min=".3" max="4" step=".05" value="1"><output id="dv">1.00</output>米</label></div>
<p class="small">固定接近情境；人物并排显示便于比较，画面间距不表示相遇距离。新版本为个人基底两侧各预留15%互动余量。</p>
<canvas id="canvas" width="1180" height="620"></canvas><p id="state">连接本地实时计算…</p><p class="small">独立C#骨架预览，尚未接入Unity。原片循环缝保留。status为输入设定；前倾、低头所表达的人物印象需要另行评价。动作：Bandai Namco Research，CC BY-NC 4.0。</p>
<script>
const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d');let paused=false,reset=true,lastData=null,times=[];const session=Date.now().toString(36)+Math.random().toString(36).slice(2);
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),unit=a=>{let n=Math.hypot(...a);return a.map(v=>v/n)};
function draw(data){lastData=data;ctx.clearRect(0,0,1180,620);let p=data.source,n=data.names,hip=n.indexOf('Hips'),r=unit(sub(p[n.indexOf('UpperArm_R')],p[n.indexOf('UpperArm_L')]));r[1]=0;r=unit(r);let f=[-r[2],0,r[0]],yaw=+$('view').value;
 const project=(v,center)=>{let d=[v[0]-p[hip][0],v[1],v[2]-p[hip][2]];return [center+(dot(d,r)*Math.cos(yaw)+dot(d,f)*Math.sin(yaw))*430,505-v[1]*430]};
 function skeleton(pose,center,ghost){let points=pose.map(v=>project(v,center));for(let j=0;j<points.length;j++){let parent=data.parents[j];if(parent===null)continue;ctx.strokeStyle=ghost?'#d2d8d3':n[j].includes('_L')?'#33758c':n[j].includes('_R')?'#b87347':'#556167';ctx.lineWidth=ghost?2:n[j].includes('EndSite')?2:5;ctx.beginPath();ctx.moveTo(...points[parent]);ctx.lineTo(...points[j]);ctx.stroke()}if(!ghost){points.forEach((q,j)=>{ctx.beginPath();ctx.arc(...q,n[j]==='Head'?10:3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#556167';ctx.lineWidth=1.5;ctx.stroke()})}}
 data.actors.forEach((actor,i)=>{let center=295+590*i;ctx.strokeStyle='#d2d8d3';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(center-250,505);ctx.lineTo(center+250,505);ctx.stroke();skeleton(data.source,center,true);skeleton(actor.pose,center,false);ctx.textAlign='center';ctx.fillStyle='#253237';ctx.font='21px system-ui';ctx.fillText(`${i?'B':'A'} · status ${data.statuses[i].toFixed(2)}`,center,38);ctx.font='16px system-ui';ctx.fillText(`紧缩 ${actor.target.toFixed(3)}  ·  互动 ${actor.offset.toFixed(3)}`,center,547);ctx.fillText(`躯干 ${actor.torso.toFixed(1)}°  ·  头颈 ${actor.head.toFixed(1)}°  ·  下降 ${(actor.lowering*100).toFixed(2)}%`,center,578)})}
['a','b','distance'].forEach(id=>$(id).oninput=()=>$(id==='distance'?'dv':id+'v').textContent=(+$(id).value).toFixed(2));$('clip').onchange=()=>reset=true;$('mode').onchange=()=>reset=true;$('view').onchange=()=>lastData&&draw(lastData);$('reset').onclick=()=>{reset=true;paused=false;$('pause').textContent='暂停'};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停'};
async function tick(){let start=performance.now();if(!paused){try{const q=new URLSearchParams({session,reset:reset?'1':'0',clip:$('clip').value,mode:$('mode').value,a:$('a').value,b:$('b').value,distance:$('distance').value,interaction:$('interaction').checked?'1':'0'});let response=await fetch('/step?'+q);if(!response.ok)throw new Error(await response.text());reset=false;let data=await response.json();draw(data);times.push(start);if(times.length>30)times.shift();let fps=times.length>1?(times.length-1)*1000/(start-times[0]):0;$('state').textContent=`运行 ${data.t.toFixed(1)} 秒 · ${fps.toFixed(1)} fps · 本轮计算 ${response.headers.get('X-Compute-Ms')} ms`;}catch(e){$('state').textContent='连接未就绪：'+e.message}}setTimeout(tick,Math.max(0,1000/30-(performance.now()-start)))}tick();
</script></html>
